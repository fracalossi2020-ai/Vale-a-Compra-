services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vale_ou_golpe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vale_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  vale_data:
